apiVersion: v1
kind: Service
metadata:
  name: network-latency-server
spec:
  selector:
    app: network-latency-server
  ports:
    - name: tcp-5014
      port: 5014
      targetPort: 5014
      protocol: TCP
    - name: udp-5014
      port: 5014
      targetPort: 5014
      protocol: UDP
  type: LoadBalancer