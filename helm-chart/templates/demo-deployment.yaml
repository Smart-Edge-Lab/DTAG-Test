{{- if .Values.demo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network-latency-server.fullname" . }}-demo
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "network-latency-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.demo.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "network-latency-server.fullname" . }}-demo
  template:
    metadata:
      labels:
        app: {{ include "network-latency-server.fullname" . }}-demo
      annotations:
        # restart the pod when the page content changes so the update is immediate
        checksum/html: {{ include (print $.Template.BasePath "/demo-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: "{{ .Values.demo.image.repository }}:{{ .Values.demo.image.tag }}"
          imagePullPolicy: {{ .Values.demo.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: {{ include "network-latency-server.fullname" . }}-demo-html
{{- end }}
