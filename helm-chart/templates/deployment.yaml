apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network-latency-server.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "network-latency-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "network-latency-server.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "network-latency-server.fullname" . }}
    spec:
      containers:
        - name: {{ include "network-latency-server.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- range .Values.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
