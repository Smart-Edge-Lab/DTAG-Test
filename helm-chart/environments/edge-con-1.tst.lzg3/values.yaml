# Default values for network-latency-server.

nameOverride: ""
fullnameOverride: "network-latency-server"

namespace: westcluster

replicaCount: 1

image:
  repository: docker.io/akcun002/network-latency-server
  tag: latest
  pullPolicy: IfNotPresent

# Application ports (used for container, service and networkpolicy)
ports:
  - name: tcp-5014
    port: 5014
    targetPort: 5014
    protocol: TCP
  - name: udp-5014
    port: 5014
    targetPort: 5014
    protocol: UDP

env:
  - name: OTLP_ENDPOINT
    value: "http://3.70.114.43:4317"
  - name: TEST_VALUE
    value: "Test"

service:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  externalTrafficPolicy: Local
  sessionAffinity: None
  annotations:
    metallb.io/address-pool: p-ipmb-public
    metallb.io/loadBalancerIPs: "37.51.202.248,2a01:598:7e0:953::"

networkPolicy:
  enabled: true
  name: westcluster-allow-all
  # Set to [] to allow all pods (matches podSelector: {} from source manifest)
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - port: 5014
          protocol: TCP
        - port: 5014
          protocol: UDP
    - {}
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0

demo:
  enabled: true
  clusterName: "lzg3"
  title: "GitOps with FluxCD"
  message: "Hello from Git"
  accentColor: "#0a7ea4"
